<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pingos Dicen · Presentador</title><link rel="stylesheet" href="./show.css"></head>
<body class="host"><main>
<header class="host-header"><div><a href="/">← KroniX</a><h1>Pingos Dicen</h1></div><button id="project" class="primary">Abrir pantalla del público ↗</button></header>
<p id="connection" role="status">Arrastra la ventana del público al televisor y activa pantalla completa.</p>
<section class="setup panel"><label>Enfrentamiento <select id="match"></select></label><label>Equipo 1 <input id="left" maxlength="28"></label><label>Equipo 2 <input id="right" maxlength="28"></label></section>
<section class="panel"><div class="toolbar"><label>Pregunta <select id="round"></select></label><label><input type="checkbox" id="mute"> Silenciar efectos</label><button id="question-toggle">Ocultar pregunta</button></div>
<h2 id="question"></h2><div id="answers" class="answer-controls"></div>
<div class="toolbar board-tools"><button id="strike">✕ Marcar error</button><button id="clear">Limpiar errores</button><button id="undo">Deshacer</button></div></section>
<section class="panel"><div class="metrics"><div>En juego <strong id="pool"></strong></div><div>Errores <strong id="errors"></strong></div><div>Marcador <strong id="score"></strong></div></div>
<div class="toolbar"><button id="award-left" class="primary">Puntos al equipo 1</button><button id="award-right" class="primary">Puntos al equipo 2</button><button id="next">Siguiente pregunta →</button></div><p id="status" role="status"></p></section>
<section class="panel"><h2>Marcadores en los celulares</h2><p>Comparte un enlace con cada equipo. En iPhone, abre en Safari y elige ‘Añadir a pantalla de inicio’.</p><button id="enable-scores">Activar marcadores</button><p id="sync-status" role="status"></p><div id="team-links" class="team-links"></div></section>
</main><script type="module" src="./host.mjs"></script></body></html>
