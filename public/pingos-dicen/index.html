<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101316"><title>Pingos Dicen · Presentador</title><link rel="stylesheet" href="./show.css"><link rel="stylesheet" href="./themes.css"><script type="module" src="./theme.mjs"></script></head>
<body class="host"><main>
<header class="host-header"><div><a href="/">← KroniX</a><h1>Pingos Dicen</h1></div><button id="project" class="primary">Abrir pantalla del público ↗</button></header>
<p id="connection" role="status">Arrastra la ventana del público al televisor y activa pantalla completa.</p>
<section class="setup panel"><label>Enfrentamiento <select id="match"></select></label><label>Equipo 1 <input id="left" maxlength="28"></label><label>Equipo 2 <input id="right" maxlength="28"></label></section>
<div class="host-grid"><section class="panel play-panel"><div class="toolbar"><label>Pregunta <select id="round"></select></label><label>Tema <select id="theme"></select></label><button id="question-toggle">Ocultar pregunta</button></div>
<p class="round-label" id="round-label"></p><h2 id="question"></h2><div id="answers" class="answer-controls"></div>
<div class="toolbar board-tools"><button id="strike">✕ Marcar error</button><button id="clear">Limpiar errores</button><button id="undo">Deshacer</button></div>
<div class="sound-tools"><label><input type="checkbox" id="mute"> Silenciar efectos</label><label for="volume">Volumen</label><input type="range" id="volume" min="0" max="100" step="5" value="85"><output for="volume" id="volume-value">85 %</output><button id="test-sound">Probar sonido</button></div></section>
<section class="panel scoring-panel"><label>Equipo con el turno <select id="possession"></select></label><div class="metrics"><div>En juego <strong id="pool"></strong></div><div>Errores <strong id="errors"></strong></div><div>Marcador <strong id="score"></strong></div></div>
<div class="toolbar"><button id="award-left" class="primary">Puntos al equipo 1</button><button id="award-right" class="primary">Puntos al equipo 2</button><button id="next">Siguiente pregunta →</button></div><p id="status" role="status"></p></section>
<section class="panel"><h2>Pulsador de los equipos</h2><div class="toolbar"><button id="show-buzzer">Mostrar pulsador</button><button id="arm-buzzer" class="red-button">Abrir pulsador</button><button id="hide-buzzer">Ocultar</button></div><p id="buzzer-status" role="status"></p></section>
<section class="panel" id="effects"><h2>Efectos de sonido</h2><div class="effect-buttons"><button data-sound="ah">¡Aaaaaaaa!</button><button data-sound="clap">Aplausos</button><button data-sound="laugh">Carcajadas</button><button data-sound="boo">¡Buuuuuu!</button><button data-sound="award">Música de triunfo</button><button data-sound="intro">Música de inicio</button><button data-sound="suspense">Música de suspenso</button><button data-sound="ole">¡Ole, pingo!</button><button data-sound="stop">Detener efectos</button></div></section>
<section class="panel team-panel"><h2>Marcadores en los celulares</h2><p>Comparte un enlace con cada equipo.</p><button id="enable-scores">Activar marcadores</button><p id="sync-status" role="status"></p><div id="team-links" class="team-links"></div></section></div>
</main><script type="module" src="./host.mjs"></script></body></html>
